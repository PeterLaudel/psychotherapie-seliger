services:
  app:
    build:
      context: .
      target: builder
    image: "${IMAGE:-psychotherapie-seliger:dev}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # ollama/ollama image has no curl/wget; `ollama list` hits the local server instead
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      target: builder
    image: "${IMAGE:-psychotherapie-seliger:dev}"
    command: npx tsx src/worker.ts
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: always

volumes:
  ollama_data:
